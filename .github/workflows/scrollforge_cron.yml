name: ScrollForge content refresh

on:
  push:
    branches: [main]
    paths:
      - 'notes_raw/**'
      - 'scripts/**'
      - 'worker/**'
      - 'contracts/**'
      - 'requirements.txt'
      - '.github/workflows/scrollforge_cron.yml'
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: scrollforge-feed-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install worker dependencies
        run: python -m pip install -r requirements.txt
      - name: Slice course notes
        run: python scripts/slice_notes.py
      - name: Refresh RSS headlines and expire old content
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ICS_CALENDAR_URL: ${{ secrets.ICS_CALENDAR_URL }}
        run: python -m worker.run_pipeline --generator none
      - name: Commit and push generated data
        id: publish
        shell: bash
        run: |
          python scripts/check_pages_budget.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/feed.json docs/data/feed-meta.json docs/data/notes_index.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh ScrollForge feed"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
