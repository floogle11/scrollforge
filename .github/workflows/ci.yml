name: ScrollForge checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run offline integration and worker checks
        run: python -m pytest -q tests --ignore=tests/test_browser.py
      - name: Run real-browser UI checks
        run: python -m pytest -q tests/test_browser.py
